<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="color-scheme" content="dark light">
<title>Gastos del mes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="chooser" class="chooser" hidden>
  <h1>Que quieres usar?</h1>
  <button class="mode-btn" data-appmode="ind">Individual<small>Tus gastos, privados, solo en tu movil</small></button>
  <button class="mode-btn" data-appmode="shared">Compartido<small>Con tu pareja: reparto, saldo y fotos de tickets</small></button>
  <button class="link" id="updateApp">Actualizar app</button>
</div>
<header class="top">
  <button class="icon-btn" id="prev" aria-label="Mes anterior">&#8249;</button>
  <h1 id="monthTitle">Mes</h1>
  <button class="icon-btn" id="next" aria-label="Mes siguiente">&#8250;</button>
</header>
<div class="modebar"><span id="modeName"></span><button class="link" id="modeSwitch">Cambiar</button></div>
<div id="banner" class="banner" hidden></div>
<main id="view"></main>

<button class="fab" id="fab" aria-label="Anadir">+</button>

<nav class="tabs" aria-label="Secciones">
  <button data-tab="mes" aria-current="page">Resumen</button>
  <button data-tab="hist">Historial</button>
  <button data-tab="ajustes">Ajustes</button>
</nav>

<!-- Gasto / ingreso extra / aportacion a un objetivo -->
<dialog id="dlg">
  <form id="form" autocomplete="off">
    <div class="seg" id="modes" role="tablist" aria-label="Que quieres anadir">
      <button type="button" role="tab" data-mode="expense">Gasto</button>
      <button type="button" role="tab" data-mode="income">Ingreso extra</button>
      <button type="button" role="tab" data-mode="goal">Aportacion</button>
    </div>
    <h2 id="dlgTitle">Nuevo gasto</h2>
    <label>Importe (EUR)
      <input id="fAmount" inputmode="decimal" placeholder="0,00" required>
    </label>
    <fieldset id="fCatsWrap">
      <legend id="fCatsLegend">Categoria</legend>
      <div id="fCats" class="chips" role="radiogroup"></div>
    </fieldset>
    <label id="fConceptLabel">Concepto (opcional)
      <input id="fConcept" maxlength="80" placeholder="Ej. supermercado">
    </label>
    <label>Fecha
      <input id="fDate" type="date" required>
    </label>
    <p id="fError" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn ghost" id="fCancel">Cancelar</button>
      <button type="button" class="btn danger" id="fDelete" hidden>Borrar</button>
      <button type="submit" class="btn primary" id="fSave">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Gran pago planificado -->
<dialog id="dlgPay">
  <form id="payForm" autocomplete="off">
    <h2 id="payTitle">Gran pago</h2>
    <label>Que es
      <input id="pName" maxlength="60" placeholder="Ej. seguro del coche" required>
    </label>
    <label>Importe total (EUR)
      <input id="pAmount" inputmode="decimal" placeholder="0,00" required>
    </label>
    <fieldset><legend>Categoria</legend><div id="pCats" class="chips" role="radiogroup"></div></fieldset>
    <div class="grid2">
      <label>Mes del pago
        <select id="pMonth"></select>
      </label>
      <label>Año
        <input id="pYear" type="number" min="2020" max="2100" required>
      </label>
    </div>
    <fieldset><legend>Como lo repartes</legend><div id="pSpreads" class="chips" role="radiogroup"></div></fieldset>
    <label class="check"><input type="checkbox" id="pRepeat"> Se repite cada año</label>
    <p id="pPreview" class="small mut"></p>
    <p id="pError" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn ghost" id="pCancel">Cancelar</button>
      <button type="button" class="btn danger" id="pDelete" hidden>Borrar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Gasto compartido / pago entre vosotros -->
<dialog id="dlgS">
  <form id="sForm" autocomplete="off">
    <h2 id="sTitle">Nuevo gasto compartido</h2>
    <label>Importe (EUR)
      <input id="sAmount" inputmode="decimal" placeholder="0,00" required>
    </label>
    <label id="sPlaceLabel">Lugar / local
      <input id="sPlace" list="sPlaces" maxlength="60" placeholder="Ej. Mercadona">
      <datalist id="sPlaces"></datalist>
    </label>
    <fieldset id="sCatWrap"><legend>Categoria</legend><div id="sCats" class="chips"></div></fieldset>
    <fieldset><legend id="sPayerLegend">Quien pago</legend><div id="sPayer" class="chips"></div></fieldset>
    <fieldset id="sSplitWrap"><legend>Reparto</legend><div id="sSplit" class="chips"></div>
      <label id="sPctLabel" hidden>Parte de quien paga (%)<input id="sPct" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
    </fieldset>
    <label>Fecha
      <input id="sDate" type="date" required>
    </label>
    <label id="sNoteLabel">Nota (opcional)
      <input id="sNote" maxlength="120">
    </label>
    <fieldset id="sPhotoWrap"><legend>Foto del ticket</legend>
      <input id="sFileCam" type="file" accept="image/*" capture="environment" hidden>
      <input id="sFilePick" type="file" accept="image/*" hidden>
      <div class="row"><button type="button" class="btn" id="sShot">Hacer foto</button><button type="button" class="btn" id="sPick">Galeria</button></div>
      <img id="sPhotoPrev" alt="Foto del ticket" hidden>
      <button type="button" class="link" id="sPhotoRemove" hidden>Quitar foto</button>
    </fieldset>
    <p id="sError" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn ghost" id="sCancel">Cancelar</button>
      <button type="button" class="btn danger" id="sDelete" hidden>Borrar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
