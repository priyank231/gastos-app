<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="color-scheme" content="dark light">
<title>Gastos del mes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="icon-btn" id="prev" aria-label="Mes anterior">&#8249;</button>
  <h1 id="monthTitle">Mes</h1>
  <button class="icon-btn" id="next" aria-label="Mes siguiente">&#8250;</button>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view"></main>

<button class="fab" id="fab" aria-label="Anadir gasto">+</button>

<nav class="tabs" aria-label="Secciones">
  <button data-tab="mes" aria-current="page">Resumen</button>
  <button data-tab="hist">Historial</button>
  <button data-tab="ajustes">Ajustes</button>
</nav>

<dialog id="dlg">
  <form id="form" method="dialog" autocomplete="off">
    <h2 id="dlgTitle">Nuevo gasto</h2>
    <label>Importe (EUR)
      <input id="fAmount" inputmode="decimal" placeholder="0,00" required>
    </label>
    <fieldset>
      <legend>Categoria</legend>
      <div id="fCats" class="chips" role="radiogroup"></div>
    </fieldset>
    <label>Concepto (opcional)
      <input id="fConcept" maxlength="80" placeholder="Ej. supermercado">
    </label>
    <label>Fecha
      <input id="fDate" type="date" required>
    </label>
    <p id="fError" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn ghost" id="fCancel">Cancelar</button>
      <button type="button" class="btn danger" id="fDelete" hidden>Borrar</button>
      <button type="submit" class="btn primary" id="fSave">Guardar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
