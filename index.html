<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h13l-3-3M17 17H4l3 3"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c3 0 5 1.5 5 4.5"/></symbol>
  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/></symbol>
</svg>

<div id="chooser" class="chooser" hidden>
  <img class="logo" src="icon.svg" alt="" width="76" height="76">
  <h1>Gastos</h1>
  <p class="sub">¿Qué quieres usar?</p>
  <button class="mode-card" data-appmode="ind">
    <span class="mode-ic"><svg class="ic"><use href="#i-user"/></svg></span>
    <span><b>Individual</b><small>Tus gastos, privados, solo en tu móvil</small></span>
  </button>
  <button class="mode-card" data-appmode="shared">
    <span class="mode-ic alt"><svg class="ic"><use href="#i-users"/></svg></span>
    <span><b>Compartido</b><small>Con tu pareja: reparto, saldo y fotos de tickets</small></span>
  </button>
  <button class="link" id="updateApp">Actualizar app</button>
</div>

<header class="top">
  <button class="icon-btn" id="prev" aria-label="Anterior"><svg class="ic"><use href="#i-left"/></svg></button>
  <h1 id="monthTitle">Mes</h1>
  <button class="icon-btn" id="next" aria-label="Siguiente"><svg class="ic"><use href="#i-right"/></svg></button>
</header>
<div class="modebar">
  <span class="pill" id="modeName"></span>
  <button class="pill-btn" id="modeSwitch"><svg class="ic sm"><use href="#i-swap"/></svg>Cambiar</button>
</div>
<div id="banner" class="banner" role="alert" hidden></div>
<main id="view"></main>

<button class="fab" id="fab" aria-label="Añadir"><svg class="ic lg"><use href="#i-plus"/></svg></button>

<nav class="tabs" aria-label="Secciones">
  <button data-tab="mes" aria-current="page"><svg class="ic"><use href="#i-chart"/></svg><span>Resumen</span></button>
  <button data-tab="hist"><svg class="ic"><use href="#i-list"/></svg><span>Historial</span></button>
  <button data-tab="ajustes"><svg class="ic"><use href="#i-sliders"/></svg><span>Ajustes</span></button>
</nav>

<!-- Gasto / ingreso extra / aportación (modo individual) -->
<dialog id="dlg" class="sheet">
  <form id="form" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <div class="seg" id="modes" role="tablist" aria-label="Qué quieres añadir">
      <button type="button" role="tab" data-mode="expense">Gasto</button>
      <button type="button" role="tab" data-mode="income">Ingreso extra</button>
      <button type="button" role="tab" data-mode="goal">Aportación</button>
    </div>
    <h2 id="dlgTitle">Nuevo gasto</h2>
    <div id="scanWrap" class="scan">
      <div class="row">
        <button type="button" class="btn soft" id="fScanCam"><svg class="ic"><use href="#i-camera"/></svg>Escanear ticket</button>
        <button type="button" class="btn soft" id="fScanPick"><svg class="ic"><use href="#i-image"/></svg>Galería</button>
      </div>
      <input id="fFileCam" type="file" accept="image/*" capture="environment" hidden>
      <input id="fFilePick" type="file" accept="image/*" hidden>
      <p id="fScanStatus" class="scan-status" role="status" aria-live="polite" hidden></p>
    </div>
    <label>Importe (€)
      <input id="fAmount" inputmode="decimal" placeholder="0,00" required>
    </label>
    <fieldset id="fCatsWrap">
      <legend id="fCatsLegend">Categoría</legend>
      <div id="fCats" class="chips" role="radiogroup"></div>
    </fieldset>
    <label id="fConceptLabel">Concepto (opcional)
      <input id="fConcept" maxlength="80" placeholder="Ej. supermercado">
    </label>
    <label>Fecha
      <input id="fDate" type="date" required>
    </label>
    <p id="fError" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn ghost" id="fCancel">Cancelar</button>
      <button type="button" class="btn danger" id="fDelete" hidden>Borrar</button>
      <button type="submit" class="btn primary" id="fSave">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Gran pago planificado -->
<dialog id="dlgPay" class="sheet">
  <form id="payForm" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="payTitle">Gran pago</h2>
    <label>Qué es
      <input id="pName" maxlength="60" placeholder="Ej. seguro del coche" required>
    </label>
    <label>Importe total (€)
      <input id="pAmount" inputmode="decimal" placeholder="0,00" required>
    </label>
    <fieldset><legend>Categoría</legend><div id="pCats" class="chips" role="radiogroup"></div></fieldset>
    <div class="grid2">
      <label>Mes del pago
        <select id="pMonth"></select>
      </label>
      <label>Año
        <input id="pYear" type="number" min="2020" max="2100" required>
      </label>
    </div>
    <fieldset><legend>Cómo lo repartes</legend><div id="pSpreads" class="chips" role="radiogroup"></div></fieldset>
    <label class="check"><input type="checkbox" id="pRepeat"> Se repite cada año</label>
    <p id="pPreview" class="preview"></p>
    <p id="pError" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn ghost" id="pCancel">Cancelar</button>
      <button type="button" class="btn danger" id="pDelete" hidden>Borrar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Gasto compartido / pago entre vosotros -->
<dialog id="dlgS" class="sheet">
  <form id="sForm" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sTitle">Nuevo gasto compartido</h2>
    <label>Importe (€)
      <input id="sAmount" inputmode="decimal" placeholder="0,00" required>
    </label>
    <label id="sPlaceLabel">Lugar / local
      <input id="sPlace" list="sPlaces" maxlength="60" placeholder="Ej. Mercadona">
      <datalist id="sPlaces"></datalist>
    </label>
    <fieldset id="sCatWrap"><legend>Categoría</legend><div id="sCats" class="chips"></div></fieldset>
    <fieldset><legend id="sPayerLegend">Quién pagó</legend><div id="sPayer" class="chips"></div></fieldset>
    <fieldset id="sSplitWrap"><legend>Reparto</legend><div id="sSplit" class="chips"></div>
      <label id="sPctLabel" hidden>Parte de quien paga (%)<input id="sPct" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
    </fieldset>
    <label>Fecha
      <input id="sDate" type="date" required>
    </label>
    <label id="sNoteLabel">Nota (opcional)
      <input id="sNote" maxlength="120">
    </label>
    <fieldset id="sPhotoWrap" class="scan"><legend>Foto del ticket</legend>
      <input id="sFileCam" type="file" accept="image/*" capture="environment" hidden>
      <input id="sFilePick" type="file" accept="image/*" hidden>
      <div class="row">
        <button type="button" class="btn soft" id="sShot"><svg class="ic"><use href="#i-camera"/></svg>Hacer foto</button>
        <button type="button" class="btn soft" id="sPick"><svg class="ic"><use href="#i-image"/></svg>Galería</button>
      </div>
      <img id="sPhotoPrev" alt="Foto del ticket" hidden>
      <div class="row tight">
        <button type="button" class="link" id="sRead" hidden>Leer el ticket</button>
        <button type="button" class="link" id="sPhotoRemove" hidden>Quitar foto</button>
      </div>
      <p id="sScanStatus" class="scan-status" role="status" aria-live="polite" hidden></p>
    </fieldset>
    <p id="sError" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn ghost" id="sCancel">Cancelar</button>
      <button type="button" class="btn danger" id="sDelete" hidden>Borrar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
